name: Build PhasmoCheatV

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fix ImGui backends paths
        shell: pwsh
        run: |
          $backends = @(
            "imgui_impl_dx11.cpp",
            "imgui_impl_dx11.h",
            "imgui_impl_win32.cpp",
            "imgui_impl_win32.h"
          )
          foreach ($f in $backends) {
            $src = "libs\imgui\backends\$f"
            $dst = "libs\imgui\$f"
            if (Test-Path $src) {
              Copy-Item $src $dst -Force
              Write-Host "Copied $f"
            } else {
              Write-Error "Missing: $src"
            }
          }

      - name: Create miniz_export.h
        shell: pwsh
        run: |
          @"
          #pragma once
          #ifndef MINIZ_EXPORT
          #define MINIZ_EXPORT
          #endif
          "@ | Set-Content -Path "libs\miniz\miniz_export.h" -Encoding UTF8
          Write-Host "Created libs\miniz\miniz_export.h"

      - name: Copy stb_image.h into imgui folder
        shell: pwsh
        run: |
          $src = "libs\stb\stb_image.h"
          $dst = "libs\imgui\stb_image.h"
          if (Test-Path $src) {
            Copy-Item $src $dst -Force
            Write-Host "Copied stb_image.h → libs\imgui\"
          } else {
            Write-Error "Missing: $src"
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore "PhasmoCheatV Recode.sln"

      - name: Build solution
        run: |
          msbuild "PhasmoCheatV Recode.sln" `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /m `
            /v:minimal

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PhasmoCheatV-Release
          path: |
            **/Release/**/*.dll
            **/Release/**/*.exe
            **/Release/**/*.pdb
            **/x64/Release/**/*.dll
            **/x64/Release/**/*.exe
            **/x64/Release/**/*.pdb
            **/build/**/*.exe
            **/build/**/*.dll
            **/build/**/*.pdb
          if-no-files-found: warn
